; PlatformIO build for the EPG RP2040 firmware (Raspberry Pi Pico H, arduino-pico core).
;   Build:   pio run
;   Flash:   hold BOOTSEL, plug in USB, then   pio run -t upload
;            (or drag .pio/build/pico/firmware.uf2 onto the RPI-RP2 drive)
;
; Verified build: platform raspberrypi 1.20.0, framework-arduinopico 1.60100.0 (arduino-pico 6.1),
; GCC 16.1 -> ~45 kB flash, ~66 kB RAM.
;
; The portable protocol codec (proto/epg_proto.c) is compiled alongside src/ and is the SAME
; code unit-tested on the PC in test/, so the wire format cannot drift from the Python host.
;
; Board options can be overridden here, e.g.  -DEPG_VS_POLARITY=-1  -DEPG_ADC_CLK_FROM_RP2040=0
; (see src/board.h for the full list).

[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower
build_flags =
    -I proto
    -Wall
build_src_filter = +<*> +<../proto/epg_proto.c>
monitor_speed = 115200
